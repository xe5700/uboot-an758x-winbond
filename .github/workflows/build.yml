name: Build AN758x U-Boot (Winbond migration)

# Temporary migration stack for Winbond W29N02KVSIAF boards:
# BL2 and U-Boot read the vendor 8-bit layout and rewrite UBI at 4-bit, then
# the board is returned to the official 4-bit preloader and FIP.
#
# Image authentication is disabled in this build (BRIDGE_TBB=0) on purpose, so
# no signing key is required.  The official 4-bit stack flashed afterwards
# keeps its own signed chain.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - hg5382a
          - hg5585f-ct
          - hg5585f-cu

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison ca-certificates curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-none-eabi libssl-dev \
            python3 python3-pyelftools swig

      - name: Download Mbed TLS
        run: |
          curl -L https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz |
            tar -xz
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.4.1" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} (migration)
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: arm-none-eabi-
          BUILD_JOBS: 4
          BRIDGE_ECC: "1"
          BRIDGE_TBB: "0"
        run: ./scripts/build-an758x.sh "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: an758x-${{ matrix.target }}-tmp-8bit-read-4bit-write
          path: output/${{ matrix.target }}-tmp-8bit-read-4bit-write/an75*
          if-no-files-found: error

  release:
    # Branch pushes refresh a rolling release, tags publish a versioned one.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: an758x-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'migration-latest' }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --generate-notes \
              --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi

